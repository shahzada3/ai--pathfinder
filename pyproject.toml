[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinder-ai"
version = "0.1.0"
description = "AI-powered personalized learning path recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.40.0",
    "pydantic==2.8.2",
    "python-multipart==0.0.9",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pylint]
max-line-length = 120
disable = ["C0111"]
